# 주가 감시 - 자동 실행 + 웹사이트 (GitHub Actions + GitHub Pages, 모두 무료)
#
# - 평일 장중(KST 09:00~15:55) 5분마다, 장 외에는 하루 6번 실행합니다.
#   (GitHub 시각은 UTC 기준: KST = UTC + 9시간. GitHub 사정으로 몇 분 늦게 시작될 수 있습니다)
# - 공개 저장소는 GitHub Actions 사용 시간이 무제한 무료입니다.
# - 사이트 주소: https://<계정>.github.io/<저장소>/  (분석 자료는 SITE_PASSWORD로 암호화되어 있어 비밀번호 없이는 못 봅니다)
# - 필요한 비밀값(Settings → Secrets and variables → Actions):
#     SITE_PASSWORD  사이트 비밀번호 (4자 이상)
#     DATA_KEY       기록 백업용 열쇠 (선택. 없으면 SITE_PASSWORD 사용. 한 번 정하면 바꾸지 마세요)
#     NAVER_CLIENT_ID / NAVER_CLIENT_SECRET  네이버 검색 API (선택. NAVER API HUB의 Client ID·Secret, 하루 2만5천 건 무료)
#     DART_API_KEY                           금융감독원 DART 오픈API (공시 목록, 무료. 없으면 네이버 공시 목록)
#     KIS_APP_KEY / KIS_APP_SECRET           한국투자증권 Open API (선택. 시세 조회만)
#     CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID  실시간 중계 서버 (선택)
# - 기록(SQLite)은 암호화해서 실행 사이에 넘기고(Actions 캐시), 1시간마다 릴리스 '최신 백업'에도 백업합니다.
# - 사이트에서 '기사 직접 등록'·'목록에서 빼기'를 누르면 GitHub 이슈(내용 암호화)가 만들어지고, 다음 정기 실행 때 저장소 주인이 만든 이슈만 반영합니다.
#   (이슈로 바로 시작된 실행은 GitHub이 기록 저장을 막아서, 이슈로는 실행하지 않음)

name: 주가 감시

on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"             # KST 09:00 ~ 15:55, 5분마다 (평일)
    - cron: "23 7,9,12,15,21,23 * * *"    # KST 16:23 18:23 21:23 00:23 06:23 08:23
  workflow_dispatch:
    inputs:
      test_alert:
        description: "알림 시험 보내기"
        type: boolean
        default: false
  push:
    branches: [main]                    # 코드를 고치면 바로 한 번 실행

permissions:
  contents: write     # 릴리스 백업
  pages: write        # 사이트 올리기
  id-token: write     # 사이트 올리기
  issues: write       # 사이트 요청(이슈) 처리
  actions: write      # 오래된 캐시 정리

jobs:
  monitor:
    concurrency:
      group: monitor
      cancel-in-progress: false
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      GO_STATIC_SITE: "1"
      GO_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GO_DATA_KEY: ${{ secrets.DATA_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}          # 선택: 국제·정치 이슈 기사 검색 (없으면 건너뜀)
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}                # 공시 목록 (금융감독원 DART, 없으면 예전처럼 네이버)
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}                  # 한국투자증권 Open API (시세 조회만, 시험 운행 중)
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}    # 실시간 중계 (Cloudflare Worker)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GO_INTERVAL_MIN: "5"
      GO_ALERT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 지난 기록 가져오기 (직전 실행)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: db-

      - name: 지난 기록 가져오기 (백업 - 직전 실행 기록이 없을 때만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls state/*.db.enc >/dev/null 2>&1; then echo "직전 실행 기록이 있습니다."; exit 0; fi
          mkdir -p restore
          if gh release download latest-backup -p monitor.db.enc -D restore 2>/dev/null; then
            echo "최신 백업(릴리스)에서 이어 씁니다."
          elif f=$(gh release view weekly-backup --json assets --jq '[.assets[].name] | sort | last' 2>/dev/null) && [ -n "$f" ] \
               && gh release download weekly-backup -p "$f" -D restore 2>/dev/null; then
            echo "최신 백업을 받지 못해 주간 백업($f)에서 이어 씁니다."
          elif gh release view latest-backup >/dev/null 2>&1; then
            # 백업이 있는데 받지 못함: 빈 기록으로 시작하면 백업을 덮어쓰므로 이번 실행은 멈춤
            echo "::error::백업을 내려받지 못했습니다. 빈 기록으로 시작하지 않고 이번 실행을 멈춥니다."
            exit 1
          else
            echo "백업이 없습니다 (첫 실행)."
          fi

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집 · 분석 · 사이트 만들기
        run: python cloud_job.py

      - name: 기록 넘기기 (다음 실행용, 암호화)
        if: always() && hashFiles('state/*.db.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 사이트 파일 묶기
        if: success() && hashFiles('_site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 사이트 올리기
        id: deploy
        if: success() && hashFiles('_site/index.html') != ''
        uses: actions/deploy-pages@v4

      - name: 최신 백업 (릴리스 '최신 백업', 1시간마다 덮어씀)
        if: always() && hashFiles('backup/*.db.enc') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 브랜치는 파일 하나가 100MB를 넘으면 올라가지 않으므로 릴리스 첨부 파일로 보관 (파일당 2GB까지)
          gh release view latest-backup >/dev/null 2>&1 || gh release create latest-backup --latest=false \
            --title "최신 백업 (암호화)" --notes "감시 기록의 최신 백업입니다. 1시간마다 덮어쓰며 DATA_KEY 없이는 열 수 없습니다."
          gh release upload latest-backup backup/monitor.db.enc --clobber
          echo "최신 백업: $(du -h backup/monitor.db.enc | cut -f1)"

      - name: 주간 백업 (릴리스 '주간 백업'에 날짜별로, 26주 보관)
        if: always() && hashFiles('weekly/*.db.enc') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 기록 파일이 100MB에 가까워 브랜치(파일 100MB 제한) 대신 릴리스 첨부 파일로 보관 (파일당 2GB까지)
          gh release view weekly-backup >/dev/null 2>&1 || gh release create weekly-backup --latest=false \
            --title "주간 백업 (암호화)" --notes "감시 기록의 주간 백업입니다. 날짜별로 26주 보관하며 DATA_KEY 없이는 열 수 없습니다."
          gh release upload weekly-backup weekly/*.db.enc --clobber
          gh release view weekly-backup --json assets --jq '[.assets[].name] | sort | .[:-26][]' \
            | xargs -r -n1 gh release delete-asset weekly-backup -y
          echo "주간 백업: $(ls weekly)"

      - name: 오래된 기록 캐시 정리
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key db- --sort created_at --order desc --limit 100 --json id --jq '.[4:][].id' \
            | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true

  chain:
    # GitHub의 정해진 시각 실행(schedule)은 자주 건너뛰어져서(특히 아침 장 시작 전), 실행이 끝날 때마다
    # 다음 실행을 직접 예약해 하루 종일 이어 감: 장중(평일 08:45~16:00)은 약 20초 뒤, 그 밖에는 약 15분 뒤.
    needs: monitor
    if: always() && github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 다음 실행 예약
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Asia/Seoul date +%H%M); dow=$(TZ=Asia/Seoul date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 0845 ] && [ "$now" -lt 1600 ]; then wait=20
          elif [ "$dow" -le 5 ] && [ "$now" -ge 0815 ] && [ "$now" -lt 0845 ]; then wait=60
          else wait=840; fi
          sleep $wait
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow monitor.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID})] | length")
          if [ "$others" = "0" ]; then
            gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref main && echo "다음 실행을 예약했습니다 (${wait}초 대기 후)."
          else
            echo "다른 실행이 이미 대기 중이라 예약하지 않습니다."
          fi
