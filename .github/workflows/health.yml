# 사이트 지킴이 (주가 감시와 따로 돎)
# - 30분마다: '주가 감시'가 30분 넘게 새로 시작되지 않았으면 다시 시작시킴
#   (실행 하나가 시작에 실패하면 다음 실행 예약이 끊겨 몇 시간씩 멈춤, 2026-11-12 05:23~08:57)
#   그리고 8시간 넘게 성공하지 못했으면 실패로 표시
#   (자동 실행 자체가 멈추면 그 안의 멈춤 알림도 못 보내므로, 밖에서 확인)
# - 매주 월요일: 최신·주간 백업을 실제로 풀어 열어 보고, 핵심 표가 차 있고 최근 자료까지 있는지 확인
# 실패하면 GitHub이 저장소 주인에게 메일로 알림 (GitHub 알림 설정의 Actions 메일)
# 공개 저장소라 실행 기록도 공개 → 표별 줄 수·마지막 날짜만 남기고 값은 찍지 않음

name: 사이트 지킴이

on:
  schedule:
    - cron: "7,37 * * * *"          # 30분마다: 자동 실행 확인
    - cron: "41 1 * * 1"            # 월요일 KST 10:41: 백업 복원 시험
  workflow_dispatch:
    inputs:
      restore_test:
        description: "백업 복원 시험도 하기"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write      # 끊긴 '주가 감시'를 다시 시작

jobs:
  watchdog:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 자동 실행 확인
        run: |
          # 가장 최근 실행이 끝난 채로 30분 넘게 새 실행이 없으면 이어달리기가 끊긴 것 → 다시 시작
          # (정상일 때는 실행이 다음 실행을 예약할 때까지 '진행 중'으로 남아 있음)
          read -r created status <<< "$(gh run list -R "$GITHUB_REPOSITORY" --workflow monitor.yml --limit 1 --json createdAt,status --jq '.[0] | "\(.createdAt) \(.status)"')"
          if [ -n "$created" ] && [ "$status" = "completed" ]; then
            idle=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 60 ))
            if [ "$idle" -gt 30 ]; then
              echo "::warning::'주가 감시'가 ${idle}분째 새로 시작되지 않아 다시 시작합니다."
              gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref main
              echo "끊긴 자동 실행을 다시 시작함 (${idle}분 멈춤)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow monitor.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt')
          if [ -z "$last" ]; then echo "::error::'주가 감시' 성공한 실행을 찾지 못했습니다."; exit 1; fi
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "마지막 성공: $last (${age}분 전)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$age" -gt 480 ]; then
            echo "::error::'주가 감시' 자동 실행이 ${age}분째 성공하지 못했습니다. Actions 탭에서 실패 원인을 확인하세요 (GitHub이 예약 실행을 멈췄으면 workflow를 다시 켜야 할 수 있음)."
            exit 1
          fi

  restore-test:
    if: (github.event_name == 'workflow_dispatch' && inputs.restore_test) || github.event.schedule == '41 1 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GO_DATA_KEY: ${{ secrets.DATA_KEY }}
      GO_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: 백업 내려받기
        run: |
          mkdir -p bk
          gh release download latest-backup -p monitor.db.enc -D bk -R "$GITHUB_REPOSITORY" || echo "::error::최신 백업을 내려받지 못했습니다."
          f=$(gh release view weekly-backup -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | last' 2>/dev/null)
          if [ -n "$f" ]; then gh release download weekly-backup -p "$f" -D bk -R "$GITHUB_REPOSITORY"; else echo "주간 백업이 아직 없습니다."; fi
          ls -la bk
      - name: 풀어서 열어 보기
        run: python check_backup.py bk/*.enc | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
