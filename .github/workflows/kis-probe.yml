# 한국투자증권 오픈API 확인 (수동 실행 전용): 어떤 자료를 받을 수 있는지 표로 남김.
# 기록·사이트는 건드리지 않고, 값(가격·수량)은 찍지 않음 (공개 저장소라 실행 기록도 공개).
# 필요한 비밀값: KIS_APP_KEY, KIS_APP_SECRET (Settings → Secrets and variables → Actions)

name: KIS 확인

on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목코드"
        default: "0015G0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: 확인
        env:
          CODE: ${{ inputs.code }}
        run: python -m core.kis_probe "$CODE" | tee probe.md && cat probe.md >> "$GITHUB_STEP_SUMMARY"
