name: Observatory regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: node --check web/app.js
      - run: node --test tests/display_consistency_check.cjs tests/reaction_alignment_check.cjs tests/observatory_check.cjs
      - run: node tests/dashboard_badges_check.cjs
      - run: node tests/primary_analysis_check.cjs
