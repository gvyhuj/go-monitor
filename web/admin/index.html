<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>분석 이력 관리</title>
  <link rel="stylesheet" href="app.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><h1>분석 이력 관리</h1><a href="../">최신 분석으로</a><button id="logout" hidden>잠그기</button></header>
  <main>
    <section id="login" class="card narrow">
      <h2>관리자 전용</h2>
      <p>일반 사이트와 다른 관리자 비밀번호를 입력하세요. 이력은 이 비밀번호로 별도 암호화되어 있습니다.</p>
      <form id="login-form">
        <label for="password">관리자 비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">이력 열기</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="note">비밀번호와 열쇠는 이 브라우저에 저장하지 않습니다. 새로고침하거나 15분 동안 사용하지 않으면 다시 입력해야 합니다.</p>
    </section>
    <section id="workspace" hidden>
      <p class="note">일반 페이지에는 최신 분석만 표시됩니다. 여기에는 보관을 시작한 이후의 변경된 결과가 남습니다. 과거 전체 이력이 복구되는 것은 아닙니다.</p>
      <label for="search">기사·주가 기록 찾기</label><input id="search" type="search" placeholder="제목 또는 날짜로 검색">
      <label for="entity">비교할 기록</label><select id="entity"></select>
      <p id="loading" role="status"></p>
      <div class="columns"><section class="card"><label for="older">이전 분석</label><select id="older"></select><div id="older-view"></div></section>
        <section class="card"><label for="newer">비교할 분석</label><select id="newer"></select><div id="newer-view"></div></section></div>
      <section class="card"><h2>달라진 내용</h2><p id="comparison-note" class="note"></p><div id="differences"></div></section>
    </section>
  </main>
</body>
</html>
